<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="title">
  <title id="title">Chingangbam Deepak Angom, ML / AI engineer: LLM infrastructure and UK grid forecasting</title>
  <style>
    .sans { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .mono { font-family: Consolas, "SFMono-Regular", Menlo, "Courier New", monospace; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#14264A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1C2B48" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1000" height="300" rx="18"/></clipPath>
    <!-- Typewriter: each line is revealed by a growing clip, 4 s per line, 12 s loop -->
    <clipPath id="type1"><rect x="310" y="186" height="30" width="0">
      <animate attributeName="width" values="0;660;660;0;0" keyTimes="0;0.13;0.3;0.333;1" dur="12s" begin="0s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="type2"><rect x="310" y="186" height="30" width="0">
      <animate attributeName="width" values="0;660;660;0;0" keyTimes="0;0.13;0.3;0.333;1" dur="12s" begin="4s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="type3"><rect x="310" y="186" height="30" width="0">
      <animate attributeName="width" values="0;660;660;0;0" keyTimes="0;0.13;0.3;0.333;1" dur="12s" begin="8s" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="300" fill="url(#bg)"/>

    <!-- Drifting circuit grid -->
    <rect width="1040" height="300" fill="url(#grid)" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-40 0" dur="8s" repeatCount="indefinite"/>
    </rect>

    <!-- Grid "pulse" waveform along the bottom -->
    <path d="M0 262 H300 l12 -26 l12 46 l12 -38 l8 18 H560 l12 -26 l12 46 l12 -38 l8 18 H820 l12 -26 l12 46 l12 -38 l8 18 H1000"
          fill="none" stroke="#1E3A5F" stroke-width="2" stroke-linejoin="round"/>
    <path d="M0 262 H300 l12 -26 l12 46 l12 -38 l8 18 H560 l12 -26 l12 46 l12 -38 l8 18 H820 l12 -26 l12 46 l12 -38 l8 18 H1000"
          pathLength="1000" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
          stroke-dasharray="110 890">
      <animate attributeName="stroke-dashoffset" from="1000" to="0" dur="4s" repeatCount="indefinite"/>
    </path>

    <!-- Animated avatar -->
    <g transform="translate(150 138)">
      <circle r="72" fill="none" stroke="#38BDF8" stroke-width="2">
        <animate attributeName="r" values="72;104" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle r="88" fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-dasharray="14 10" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
      </circle>
      <circle r="74" fill="url(#accent)"/>
      <clipPath id="face"><circle r="69"/></clipPath>
      <image x="-69" y="-69" width="138" height="138" clip-path="url(#face)" preserveAspectRatio="xMidYMid slice"
             href="data:image/jpeg;base64,"/>
      <!-- A spark orbiting the avatar -->
      <circle r="5" fill="#34D399">
        <animateMotion dur="6s" repeatCount="indefinite" path="M0 -88 A88 88 0 1 1 -0.1 -88"/>
      </circle>
    </g>

    <!-- Text -->
    <text class="mono" x="290" y="84" font-size="14" fill="#8AA0BD" letter-spacing="3">HELLO, I'M</text>
    <text class="sans" x="288" y="126" font-size="38" font-weight="700" fill="#E6EDF7">Chingangbam Deepak Angom</text>
    <text class="sans" x="290" y="160" font-size="18" fill="#9FB3CF">ML / AI Engineer · MSc Artificial Intelligence, University of Aberdeen</text>

    <text class="mono" x="290" y="207" font-size="18" fill="#34D399">›
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </text>
    <g class="mono" font-size="18" fill="#38BDF8">
      <text x="312" y="207" clip-path="url(#type1)">shipping Aegis: an LLM gateway (auth · limits · screening)</text>
      <text x="312" y="207" clip-path="url(#type2)">forecasting GB grid carbon intensity with GridPulse</text>
      <text x="312" y="207" clip-path="url(#type3)">open to ML / AI engineer roles in the UK</text>
    </g>
  </g>
</svg>
